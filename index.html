<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis suscripciones</title>
<meta name="theme-color" content="#14263a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14263a;--mut:#5d6b7e;--line:#dde3ec;--acc:#3b5bdb;--on:#fff;--ok:#1f8a63;--warn:#b86e00;--bad:#c93b3b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2a;--card:#172538;--ink:#e8eef7;--mut:#94a3b8;--line:#243449;--acc:#7c93ff;--on:#0f1b2a;--ok:#4cc79a;--warn:#f0b24a;--bad:#ff7b7b}}
*{box-sizing:border-box}
html{background:#0a1424}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.4 system-ui,sans-serif;text-align:center;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
/* Video de fondo */
#fondo{position:fixed;inset:0;z-index:-1;background:#0a1424 url(fondo-poster.jpg) center/cover no-repeat}
#fondo video{width:100%;height:100%;object-fit:cover;display:block}
#fondo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a142499,#0a1424cc)}
@media(prefers-reduced-motion:reduce){#fondo video{display:none}}
main{max-width:560px;margin:auto;padding:0 16px}
header{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 0 18px}
h1{font-size:1.7rem;margin:0;color:#fff;text-shadow:0 2px 12px #0008;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
#salir{background:#ffffff1f;color:#fff;border-color:#ffffff55;font-size:.9rem;padding:8px 18px;border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#alerta{padding:12px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c)}
#alerta.vencida{--c:var(--bad)}#alerta.pronto{--c:var(--warn)}
#off{display:inline-block;color:var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.9rem;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gtit{display:flex;align-items:center;gap:12px;margin-top:10px;color:#fff;font-weight:700;font-size:.95rem;text-shadow:0 1px 8px #0009}
.gtit:first-child{margin-top:0}
.gtit::before,.gtit::after{content:"";flex:1;height:1px;background:#ffffff55}
.fila{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 8px 12px 6px;cursor:pointer}
.ok{--c:var(--ok)}.pronto{--c:var(--warn)}.vencida{--c:var(--bad)}
.dias{text-align:center;color:var(--c);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.dias small{display:block;font-size:.7rem;font-weight:400;color:var(--mut);margin-top:4px}
.txt{text-align:center;min-width:0;overflow-wrap:anywhere}
.fila strong{display:block}.fila span{display:block;color:var(--mut);font-size:.9rem;margin-top:2px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fila .ico{justify-self:center;color:var(--mut);opacity:.8}
.vacio{text-align:center;color:var(--ink);background:var(--card);border-radius:12px;padding:32px 20px}
#add{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:14px 20px;border-radius:999px;box-shadow:0 4px 14px #0004}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink);text-align:center}
dialog::backdrop{background:#060c168c;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
h2{margin:0 0 4px;font-size:1.15rem}
label,.lbl{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mut)}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center}
select{text-align-last:center}
::placeholder{text-align:center}
/* Categorías como pestañas */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{margin:0;position:relative;display:block;font-size:.85rem;color:var(--ink)}
.tab input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0;pointer-events:none}
.tab span{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);line-height:1.15;cursor:pointer}
.tab input:checked+span{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.tab input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.acc{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
#lerr{color:var(--bad);min-height:1.2em;margin:8px 0 0;font-size:.9rem}
/* Tarjeta de login con fondo */
#login{background:linear-gradient(180deg,#0a142480,#0a1424d9),url(fondo-poster.jpg) center/cover;color:#fff;border:1px solid #ffffff2e;box-shadow:0 24px 60px #000a}
#login .logo{display:block;margin:0 auto 10px;width:60px;height:60px;border-radius:16px;box-shadow:0 6px 18px #0006}
#login h2{font-size:1.3rem;margin-bottom:6px}
#login label{color:#c9d4e5}
#login input{background:#ffffff1a;border-color:#ffffff40;color:#fff}
#login input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #22345a inset;-webkit-text-fill-color:#fff;caret-color:#fff}
#login .pri{background:#7c93ff;border-color:#7c93ff;color:#0b1424}
#login #lerr{color:#ffb3b3}
#login button:focus-visible,#login input:focus-visible{outline-color:#fff}
</style></head>
<body>
<div id="fondo" aria-hidden="true"><video autoplay muted loop playsinline preload="auto" poster="fondo-poster.jpg" disablepictureinpicture disableremoteplayback><source src="fondo.mp4" type="video/mp4"></video></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-servicios" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="i-plataformas" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M10 8l5 3-5 3z"/></symbol>
<symbol id="i-dominios" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18-3-3-3-15 0-18"/></symbol>
<symbol id="i-otras" viewBox="0 0 24 24"><path d="m20 12-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1"/></symbol>
</defs></svg>
<main>
<header><h1>Mis suscripciones</h1><button id="salir">Cerrar sesión</button></header>
<div id="alerta" hidden></div>
<p id="off" hidden>Sin conexión. Mostrando los últimos datos guardados.</p>
<ul id="lista"></ul>
<button id="add" class="pri">Agregar suscripción</button>
</main>

<dialog id="form"><form id="f">
<h2>Suscripción</h2>
<span class="lbl" id="lcat">Categoría</span>
<div class="cats" role="radiogroup" aria-labelledby="lcat">
<label class="tab"><input type="radio" name="categoria" value="servicios"><span><svg class="ico"><use href="#i-servicios"/></svg>Servicios públicos</span></label>
<label class="tab"><input type="radio" name="categoria" value="plataformas"><span><svg class="ico"><use href="#i-plataformas"/></svg>Plataformas de internet</span></label>
<label class="tab"><input type="radio" name="categoria" value="dominios"><span><svg class="ico"><use href="#i-dominios"/></svg>Dominios</span></label>
<label class="tab"><input type="radio" name="categoria" value="otras"><span><svg class="ico"><use href="#i-otras"/></svg>Otras</span></label>
</div>
<label>Servicio<input name="servicio" required></label>
<label>Costo<input name="costo" placeholder="Ej. $9.99 / mes"></label>
<label>Fecha de vencimiento<input name="vencimiento" type="date" required></label>
<label>Se renueva<select name="periodo"><option value="mensual">Cada mes</option><option value="trimestral">Cada 3 meses</option><option value="semestral">Cada 6 meses</option><option value="anual">Cada año</option></select></label>
<label>Avisar con (días de anticipación)<input name="avisar" type="number" min="0" value="7"></label>
<label>Notas<input name="notas"></label>
<div class="acc">
<button class="pri">Guardar</button>
<button type="button" id="renovar">Renovar</button>
<button type="button" id="del">Eliminar</button>
<button type="button" id="cancel">Cancelar</button>
</div></form></dialog>

<dialog id="login"><form id="g">
<img class="logo" src="icon-192.png" alt="">
<h2>Entrar</h2>
<label>Correo<input name="correo" type="email" autocomplete="username" required></label>
<label>Clave<input name="token" type="password" autocomplete="current-password" required></label>
<p id="lerr" role="alert"></p>
<div class="acc"><button class="pri">Entrar</button></div>
</form></dialog>

<script>
const $ = s => document.querySelector(s), f = $('#f'), g = $('#g');
const CAMPOS = ['servicio', 'costo', 'vencimiento', 'avisar', 'notas', 'periodo', 'categoria'];
const CATS = [
  { id: 'servicios', nombre: 'Servicios públicos' },
  { id: 'plataformas', nombre: 'Plataformas de internet' },
  { id: 'dominios', nombre: 'Dominios' },
  { id: 'otras', nombre: 'Otras' }
];
// Para suscripciones guardadas antes de existir categorías: se deduce por el nombre hasta que las edites
const inferir = s => {
  const n = String(s.servicio || '').toLowerCase();
  if (/\.(com|net|org|io|app|dev|co|xyz|online|site|store|info|ve)\b|dominio|hosting/.test(n)) return 'dominios';
  if (/movistar|digitel|cantv|netuno|simpletv|\b(inter|luz|agua|gas|aseo|electricidad|telefono|internet)\b/.test(n)) return 'servicios';
  if (/gemini|netflix|spotify|youtube|disney|hbo|prime|chatgpt|openai|claude|icloud|google|office|microsoft|canva|adobe|apple|crunchyroll|paramount|dazn/.test(n)) return 'plataformas';
  return 'otras';
};
const cat = s => CATS.some(c => c.id === s.categoria) ? s.categoria : inferir(s);
// Pega aquí la URL de tu implementación de Apps Script (termina en /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbzhWledC8Xp1POXNTNafnG4FfMr3zrRxS6AgxukFCZCBxTEG0H4DMFwwiVgmJVKcOHV/exec';
let cfg = JSON.parse(localStorage.getItem('sesion') || '{}'), items = JSON.parse(localStorage.getItem('items') || '[]'), editId = null;
const hoy = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
const dias = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - hoy()) / 864e5);
const estado = s => { const d = dias(s.vencimiento); return d < 0 ? 'vencida' : d <= (+s.avisar || 7) ? 'pronto' : 'ok'; };
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fila(s) {
  const d = dias(s.vencimiento);
  return `<li class="fila ${estado(s)}" data-id="${esc(s.id)}" tabindex="0"><b class="dias">${d === 0 ? 'Hoy' : Math.abs(d)}<small>${d < 0 ? 'de atraso' : d === 0 ? '' : d === 1 ? 'día' : 'días'}</small></b><div class="txt"><strong>${esc(s.servicio)}</strong><span>${esc(s.costo)}${s.costo ? ' · ' : ''}${esc(s.periodo || 'mensual')} · ${esc(s.vencimiento)}</span></div><svg class="ico" aria-hidden="true"><use href="#i-${cat(s)}"/></svg></li>`;
}

function render() {
  const l = [...items].sort((a, b) => a.vencimiento.localeCompare(b.vencimiento));
  $('#lista').innerHTML = l.length ? CATS.map(c => {
    const g = l.filter(s => cat(s) === c.id);
    return g.length ? `<li class="gtit" role="presentation">${c.nombre}</li>` + g.map(fila).join('') : '';
  }).join('') : '<li class="vacio">Aún no tienes suscripciones. Toca “Agregar suscripción” para registrar la primera.</li>';
  const v = items.filter(s => estado(s) === 'vencida').length, p = items.filter(s => estado(s) === 'pronto').length, a = $('#alerta');
  a.hidden = !(v || p);
  a.className = v ? 'vencida' : 'pronto';
  a.textContent = [v && `${v} vencida${v > 1 ? 's' : ''}`, p && `${p} por vencer`].filter(Boolean).join(' · ');
}

const logueado = () => cfg.correo && cfg.token;
const consulta = c => `${API_URL}?email=${encodeURIComponent(c.correo)}&token=${encodeURIComponent(c.token)}`;
function abrirLogin(msg) { $('#lerr').textContent = msg || ''; if (!$('#login').open) $('#login').showModal(); }
function salir(msg) {
  cfg = {}; items = []; localStorage.removeItem('sesion'); localStorage.removeItem('items');
  $('#off').hidden = true; render(); abrirLogin(msg);
}

async function cargar() {
  if (!logueado()) { items = []; localStorage.removeItem('items'); render(); return abrirLogin(); }
  render();
  let j;
  try { j = await (await fetch(consulta(cfg))).json(); } catch { $('#off').hidden = false; return render(); }
  if (j.error === 'credenciales') return salir('Tu sesión ya no es válida. Entra de nuevo.');
  if (j.error) { $('#off').hidden = false; return render(); }
  items = j.items; localStorage.setItem('items', JSON.stringify(items)); $('#off').hidden = true;
  render();
}

async function enviar(body) {
  const j = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ email: cfg.correo, token: cfg.token, ...body }) })).json();
  if (j.error) throw 0;
}

function abrir(id) {
  editId = id || null;
  const s = items.find(x => x.id === id) || { avisar: 7 };
  for (const k of CAMPOS) f[k].value = k === 'categoria' ? (id ? cat(s) : 'servicios') : s[k] || (k === 'periodo' ? 'mensual' : k === 'avisar' ? s[k] ?? '' : '');
  $('#del').hidden = !id; $('#form').showModal();
}

f.onsubmit = async e => {
  e.preventDefault();
  const it = { id: editId || crypto.randomUUID() };
  for (const k of CAMPOS) it[k] = f[k].value;
  items = editId ? items.map(x => x.id === editId ? it : x) : [...items, it];
  localStorage.setItem('items', JSON.stringify(items)); render(); $('#form').close();
  try { await enviar({ action: 'save', item: it }); } catch { $('#off').hidden = false; }
};
$('#del').onclick = async () => {
  if (!confirm('¿Eliminar esta suscripción?')) return;
  const id = editId; items = items.filter(x => x.id !== id);
  localStorage.setItem('items', JSON.stringify(items)); render(); $('#form').close();
  try { await enviar({ action: 'delete', id }); } catch { $('#off').hidden = false; }
};
const PASO = { mensual: 1, trimestral: 3, semestral: 6, anual: 12 }, AVISO = { mensual: 7, trimestral: 10, semestral: 15, anual: 30 };
$('#renovar').onclick = () => {
  const m = PASO[f.periodo.value] || 1, h = hoy();
  const d = new Date((f.vencimiento.value || new Date(h).toISOString().slice(0, 10)) + 'T00:00:00Z');
  do { d.setUTCMonth(d.getUTCMonth() + m); } while (+d <= h);
  f.vencimiento.value = d.toISOString().slice(0, 10);
};
f.periodo.onchange = () => { if (f.avisar.value === '' || Object.values(AVISO).includes(+f.avisar.value)) f.avisar.value = AVISO[f.periodo.value]; };
$('#cancel').onclick = () => $('#form').close();
$('#add').onclick = () => abrir();
$('#lista').onclick = e => { const li = e.target.closest('.fila'); if (li) abrir(li.dataset.id); };
$('#lista').onkeydown = e => { if (e.key === 'Enter') e.target.click(); };
$('#salir').onclick = () => { if (confirm('¿Cerrar sesión? Se borrarán los datos guardados en este dispositivo (no los de tu hoja).')) salir(); };
$('#login').oncancel = e => e.preventDefault();
g.onsubmit = async e => {
  e.preventDefault();
  if (API_URL.includes('PEGA_AQUI')) return ($('#lerr').textContent = 'Falta pegar la URL del script en index.html.');
  const c = { correo: g.correo.value.trim(), token: g.token.value.trim() };
  $('#lerr').textContent = 'Entrando…';
  try {
    const j = await (await fetch(consulta(c))).json();
    if (j.error === 'credenciales') return ($('#lerr').textContent = 'Correo o clave incorrectos.');
    if (j.error) return ($('#lerr').textContent = 'Error en el script: ' + (j.detalle || j.error));
  } catch { return ($('#lerr').textContent = 'No se pudo conectar. Revisa tu internet y la URL del script.'); }
  cfg = c; localStorage.setItem('sesion', JSON.stringify(cfg)); g.reset(); $('#login').close(); cargar();
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
cargar();
</script></body></html>
