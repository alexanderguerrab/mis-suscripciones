<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis suscripciones</title>
<meta name="theme-color" content="#14263a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14263a;--mut:#5d6b7e;--line:#dde3ec;--acc:#3b5bdb;--on:#fff;--ok:#1f8a63;--warn:#b86e00;--bad:#c93b3b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2a;--card:#172538;--ink:#e8eef7;--mut:#94a3b8;--line:#243449;--acc:#7c93ff;--on:#0f1b2a;--ok:#4cc79a;--warn:#f0b24a;--bad:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px}
h1{font-size:1.5rem;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
#alerta{padding:12px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c)}
#alerta.vencida{--c:var(--bad)}#alerta.pronto{--c:var(--warn)}
#off{color:var(--mut);font-size:.9rem;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fila{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;cursor:pointer}
.ok{--c:var(--ok)}.pronto{--c:var(--warn)}.vencida{--c:var(--bad)}
.dias{min-width:64px;text-align:center;color:var(--c);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.dias small{display:block;font-size:.7rem;font-weight:400;color:var(--mut);margin-top:4px}
.fila strong{display:block}.fila span{color:var(--mut);font-size:.9rem}
.vacio{text-align:center;color:var(--mut);padding:40px 0}
#add{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:14px 20px;border-radius:999px;box-shadow:0 4px 14px #0004}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
h2{margin:0 0 4px;font-size:1.15rem}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mut)}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.acc{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#lerr{color:var(--bad);min-height:1.2em;margin:8px 0 0;font-size:.9rem}
</style></head>
<body><main>
<header><h1>Mis suscripciones</h1><button id="salir">Cerrar sesión</button></header>
<div id="alerta" hidden></div>
<p id="off" hidden>Sin conexión. Mostrando los últimos datos guardados.</p>
<ul id="lista"></ul>
<button id="add" class="pri">Agregar suscripción</button>
</main>

<dialog id="form"><form id="f">
<h2>Suscripción</h2>
<label>Servicio<input name="servicio" required></label>
<label>Costo<input name="costo" placeholder="Ej. $9.99 / mes"></label>
<label>Fecha de vencimiento<input name="vencimiento" type="date" required></label>
<label>Se renueva<select name="periodo"><option value="mensual">Cada mes</option><option value="trimestral">Cada 3 meses</option><option value="semestral">Cada 6 meses</option><option value="anual">Cada año</option></select></label>
<label>Avisar con (días de anticipación)<input name="avisar" type="number" min="0" value="7"></label>
<label>Notas<input name="notas"></label>
<div class="acc">
<button class="pri">Guardar</button>
<button type="button" id="renovar">Renovar</button>
<button type="button" id="del">Eliminar</button>
<button type="button" id="cancel">Cancelar</button>
</div></form></dialog>

<dialog id="login"><form id="g">
<h2>Entrar</h2>
<label>Correo<input name="correo" type="email" autocomplete="username" required></label>
<label>Clave<input name="token" type="password" autocomplete="current-password" required></label>
<p id="lerr" role="alert"></p>
<div class="acc"><button class="pri">Entrar</button></div>
</form></dialog>

<script>
const $ = s => document.querySelector(s), f = $('#f'), g = $('#g');
const CAMPOS = ['servicio', 'costo', 'vencimiento', 'avisar', 'notas', 'periodo'];
// https://script.google.com/macros/s/AKfycbyzgoqI6rUz4haqJCUkovdzMGp04RZSBTh_ZU4knooDVmDr7WBUw-Cr4A0e-aT13GjH/exec
const API_URL = 'https://script.google.com/macros/s/AKfycbyzgoqI6rUz4haqJCUkovdzMGp04RZSBTh_ZU4knooDVmDr7WBUw-Cr4A0e-aT13GjH/exec';
let cfg = JSON.parse(localStorage.getItem('sesion') || '{}'), items = JSON.parse(localStorage.getItem('items') || '[]'), editId = null;
const hoy = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
const dias = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - hoy()) / 864e5);
const estado = s => { const d = dias(s.vencimiento); return d < 0 ? 'vencida' : d <= (+s.avisar || 7) ? 'pronto' : 'ok'; };
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const l = [...items].sort((a, b) => a.vencimiento.localeCompare(b.vencimiento));
  $('#lista').innerHTML = l.length ? l.map(s => {
    const d = dias(s.vencimiento);
    return `<li class="fila ${estado(s)}" data-id="${esc(s.id)}" tabindex="0"><b class="dias">${d === 0 ? 'Hoy' : Math.abs(d)}<small>${d < 0 ? 'de atraso' : d === 0 ? '' : d === 1 ? 'día' : 'días'}</small></b><div><strong>${esc(s.servicio)}</strong><span>${esc(s.costo)}${s.costo ? ' · ' : ''}${esc(s.periodo || 'mensual')} · ${esc(s.vencimiento)}</span></div></li>`;
  }).join('') : '<li class="vacio">Aún no tienes suscripciones. Toca “Agregar suscripción” para registrar la primera.</li>';
  const v = items.filter(s => estado(s) === 'vencida').length, p = items.filter(s => estado(s) === 'pronto').length, a = $('#alerta');
  a.hidden = !(v || p);
  a.className = v ? 'vencida' : 'pronto';
  a.textContent = [v && `${v} vencida${v > 1 ? 's' : ''}`, p && `${p} por vencer`].filter(Boolean).join(' · ');
}

const logueado = () => cfg.correo && cfg.token;
const consulta = c => `${API_URL}?email=${encodeURIComponent(c.correo)}&token=${encodeURIComponent(c.token)}`;
function abrirLogin(msg) { $('#lerr').textContent = msg || ''; if (!$('#login').open) $('#login').showModal(); }
function salir(msg) {
  cfg = {}; items = []; localStorage.removeItem('sesion'); localStorage.removeItem('items');
  $('#off').hidden = true; render(); abrirLogin(msg);
}

async function cargar() {
  if (!logueado()) { items = []; localStorage.removeItem('items'); render(); return abrirLogin(); }
  render();
  let j;
  try { j = await (await fetch(consulta(cfg))).json(); } catch { $('#off').hidden = false; return render(); }
  if (j.error) return salir('Tu sesión ya no es válida. Entra de nuevo.');
  items = j.items; localStorage.setItem('items', JSON.stringify(items)); $('#off').hidden = true;
  render();
}

async function enviar(body) {
  const j = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ email: cfg.correo, token: cfg.token, ...body }) })).json();
  if (j.error) throw 0;
}

function abrir(id) {
  editId = id || null;
  const s = items.find(x => x.id === id) || { avisar: 7 };
  for (const k of CAMPOS) f[k].value = s[k] || (k === 'periodo' ? 'mensual' : k === 'avisar' ? s[k] ?? '' : '');
  $('#del').hidden = !id; $('#form').showModal();
}

f.onsubmit = async e => {
  e.preventDefault();
  const it = { id: editId || crypto.randomUUID() };
  for (const k of CAMPOS) it[k] = f[k].value;
  items = editId ? items.map(x => x.id === editId ? it : x) : [...items, it];
  localStorage.setItem('items', JSON.stringify(items)); render(); $('#form').close();
  try { await enviar({ action: 'save', item: it }); } catch { $('#off').hidden = false; }
};
$('#del').onclick = async () => {
  if (!confirm('¿Eliminar esta suscripción?')) return;
  const id = editId; items = items.filter(x => x.id !== id);
  localStorage.setItem('items', JSON.stringify(items)); render(); $('#form').close();
  try { await enviar({ action: 'delete', id }); } catch { $('#off').hidden = false; }
};
const PASO = { mensual: 1, trimestral: 3, semestral: 6, anual: 12 }, AVISO = { mensual: 7, trimestral: 10, semestral: 15, anual: 30 };
$('#renovar').onclick = () => {
  const m = PASO[f.periodo.value] || 1, h = hoy();
  const d = new Date((f.vencimiento.value || new Date(h).toISOString().slice(0, 10)) + 'T00:00:00Z');
  do { d.setUTCMonth(d.getUTCMonth() + m); } while (+d <= h);
  f.vencimiento.value = d.toISOString().slice(0, 10);
};
f.periodo.onchange = () => { if (f.avisar.value === '' || Object.values(AVISO).includes(+f.avisar.value)) f.avisar.value = AVISO[f.periodo.value]; };
$('#cancel').onclick = () => $('#form').close();
$('#add').onclick = () => abrir();
$('#lista').onclick = e => { const li = e.target.closest('.fila'); if (li) abrir(li.dataset.id); };
$('#lista').onkeydown = e => { if (e.key === 'Enter') e.target.click(); };
$('#salir').onclick = () => { if (confirm('¿Cerrar sesión? Se borrarán los datos guardados en este dispositivo (no los de tu hoja).')) salir(); };
$('#login').oncancel = e => e.preventDefault();
g.onsubmit = async e => {
  e.preventDefault();
  if (API_URL.includes('PEGA_AQUI')) return ($('#lerr').textContent = 'Falta pegar la URL del script en index.html.');
  const c = { correo: g.correo.value.trim(), token: g.token.value.trim() };
  $('#lerr').textContent = 'Entrando…';
  try {
    const j = await (await fetch(consulta(c))).json();
    if (j.error) return ($('#lerr').textContent = 'Correo o clave incorrectos.');
  } catch { return ($('#lerr').textContent = 'No se pudo conectar. Revisa tu internet y la URL del script.'); }
  cfg = c; localStorage.setItem('sesion', JSON.stringify(cfg)); g.reset(); $('#login').close(); cargar();
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
cargar();
</script></body></html>
